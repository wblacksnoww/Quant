# Alembic 配置。
# 数据库地址不写死在这里：alembic/env.py 会读取应用配置（QUANT_DATABASE_URL）。
# 用法（容器内，WORKDIR=/app/backend）：
#   alembic revision --autogenerate -m "描述"    # 修改模型后生成迁移
#   alembic upgrade head                          # 应用到数据库
#   alembic current / history                     # 查看状态

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
