name: 缺陷报告
description: 回测结果不对、撮合异常、界面报错等
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 先说清楚一件事

        这个项目里**"回测结果不对"有多种可能**，排查方向完全不同：

        | 现象 | 更可能是 |
        |---|---|
        | 收益高得不真实 | 数据问题（前复权 / 一字板 / 幸存者偏差） |
        | 明明该成交却零成交 | 新闻字段缺列（条件恒不成立）、算子未注册、涨跌停判定 |
        | 现金变负数 | 撮合闸门问题，属于严重缺陷 |
        | C++ 与 Python 结果不同 | 等价性被破坏，属于严重缺陷 |

        请尽量填全下面的信息，尤其是"复现步骤"和"日志"。

        > ⚠️ 贴日志前先删掉：数据库密码、`QUANT_MASTER_KEY`、券商 API key、
        > 账户口令、TOTP 密钥。这些一旦推到公开仓库就等于泄露。

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - 严重 — 回测结论不可信 / 资金计算错误 / 崩溃
        - 中等 — 功能不可用但有绕过方式
        - 轻微 — 显示问题、文案错误
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: 出问题的位置
      multiple: true
      options:
        - 回测（bar 级）
        - 回测（tick 级）
        - 模拟盘
        - 实盘
        - 拼装策略 / 蓝图（spec）
        - Python 算子（op: 字段）
        - 新闻因子
        - 数据源 / 复权 / 交易日历
        - 前端界面
        - CLI
        - 部署 / Docker
        - 不确定
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 你看到了什么？具体数字比"结果不对"有用得多。
      placeholder: |
        例如：回测 600519 2023-01-01 ~ 2023-12-31，dual_ma(fast=5,slow=20)，
        出现 3 笔成交的价格明显不在当日区间内（成交价 1680，当日 high 是 1650）。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 例如：成交价应落在 [low, high] 内，或标注为跳空成交
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 越具体越好。能贴配置/请求体最好。
      placeholder: |
        1. 打开「回测」页
        2. 标的 600519，区间 2023-01-01 ~ 2023-12-31
        3. 策略 dual_ma，参数 fast=5 slow=20，初始资金 100000
        4. 点运行 → 结果页出现上述成交
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 设置页「关于」里能看到版本与原生核心状态；或命令行输出。
      placeholder: |
        - 部署方式：Docker / 本地 ./scripts/dev.sh
        - 版本/提交：
        - Python：
        - 原生核心（native_status）：available / unavailable
        - 市场：A 股 / 加密
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: |
        后端日志、浏览器 Console、或运行日志面板的内容。
        已删除敏感信息后再贴。
      render: text
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 确认
      options:
        - label: 我已删除日志中的密码、密钥、账户凭据
          required: true
        - label: 我已搜索过现有 Issue，没有重复
          required: true
