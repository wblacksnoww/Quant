name: 功能建议
description: 新的策略能力、指标、数据源或界面改进
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## 先判断这件事该落在哪一层

        这个项目的计算是分层的，不同层的改动成本差很多：

        | 你想加的东西 | 改动量 | 需要碰 C++ 吗 |
        |---|---|---|
        | 新参数组合 / 新条件组合 | 极小 | 否，`spec` 就是数据 |
        | 新指标（先验证） | 小 | 否，写 Python 算子 |
        | 新指标（进生产） | 中 | 是，改 `cpp/indicators.cpp` + 等价性测试 |
        | 新撮合规则 / 新成本模型 | 大 | 是，改 `cpp/core.cpp` |
        | 新数据源 | 中 | 否，实现 provider 接口 |
        | 新策略（用现有指标） | 小 | 否 |

        如果你不确定，直接写目标，不用管实现。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: |
        先说问题，不要说方案。例如"我想验证波动率放大后动量是否失效"，
        比"请加一个 vol_ratio 指标"更有用 —— 也许有更合适的做法。
      placeholder: |
        例如：现在只能按固定周期调参，无法验证"波动率放大时是否该降低杠杆"，
        因为我拿不到一个稳定的波动率相对水平指标。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法（可选）
      description: 如果不确定就留空。
    validations:
      required: false

  - type: dropdown
    id: layer
    attributes:
      label: 你觉得该在哪一层
      options:
        - 不确定（让维护者判断）
        - 业务层（Python：数据、路由、界面）
        - 策略表达（spec / 算子，不用改 C++）
        - 计算核心（C++：指标 / 撮合 / 账户）
        - 前端
        - 部署 / 运维
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 试过什么替代方案
      description: 例如"用现有 sma 组合近似过，但效果不对，因为……"
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 这个能力影响谁
      description: 只有你用得上的专属需求，和多人都会用到的通用能力，优先级不同。
    validations:
      required: false

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: 确认
      options:
        - label: 我接受"这个需求可能被判定为不该加" —— 量化系统里加错功能比少加功能更危险
          required: true
